<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Rich gold gradient representing saffron and elegance -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3C64F"/>
      <stop offset="50%" stop-color="#C69C2E"/>
      <stop offset="100%" stop-color="#947118"/>
    </linearGradient>
  </defs>
  
  <!-- Outer delicate ring of dots -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="2 4"/>
  
  <!-- Outer thin solid ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity="0.6"/>

  <!-- Central Shamseh (8-pointed geometric medallion) -->
  <!-- 1. Central Diamond -->
  <polygon points="50,34 66,50 50,66 34,50" fill="url(#gold)"/>
  
  <!-- 2. Four Cardinal Diamonds (Top, Bottom, Left, Right) -->
  <polygon points="50,14 58,22 50,30 42,22" fill="url(#gold)" opacity="0.95"/>
  <polygon points="50,70 58,78 50,86 42,78" fill="url(#gold)" opacity="0.95"/>
  <polygon points="22,42 30,50 22,58 14,50" fill="url(#gold)" opacity="0.95"/>
  <polygon points="78,42 86,50 78,58 70,50" fill="url(#gold)" opacity="0.95"/>
  
  <!-- 3. Four Diagonal Diamonds (Top-Left, Top-Right, Bottom-Left, Bottom-Right) -->
  <polygon points="30,22 38,30 30,38 22,30" fill="url(#gold)" opacity="0.95"/>
  <polygon points="70,22 78,30 70,38 62,30" fill="url(#gold)" opacity="0.95"/>
  <polygon points="30,62 38,70 30,78 22,70" fill="url(#gold)" opacity="0.95"/>
  <polygon points="70,62 78,70 70,78 62,70" fill="url(#gold)" opacity="0.95"/>
  
  <!-- Inner delicate details (central tiny diamond and lines) -->
  <polygon points="50,44 56,50 50,56 44,50" fill="#FFF" opacity="0.35"/>
</svg>
