<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 3D Beveled Golden Diamond matching the page ornaments -->
  <!-- Top-Left Facet (Bright Highlight) -->
  <polygon points="50,15 50,50 15,50" fill="#F3D86F" />
  
  <!-- Top-Right Facet (Midtone Gold) -->
  <polygon points="50,15 85,50 50,50" fill="#C9A227" />
  
  <!-- Bottom-Right Facet (Shadow Gold) -->
  <polygon points="85,50 50,85 50,50" fill="#8E6F10" />
  
  <!-- Bottom-Left Facet (Reflected Shadow) -->
  <polygon points="15,50 50,50 50,85" fill="#AC871D" />
</svg>
