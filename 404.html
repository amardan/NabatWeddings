<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>Page Not Found | Nabat Persian Weddings</title>
    <!-- Google Fonts: Cormorant Garamond for Serifs, Montserrat for Sans-Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            background-color: var(--color-charcoal, #2A2725);
            color: var(--color-ivory, #FCFAF6);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: var(--spacing-sm, 2rem);
            margin: 0;
            font-family: var(--font-sans, 'Montserrat', sans-serif);
        }
        .error-container {
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 8px;
        }
        h1 {
            font-family: var(--font-serif, 'Cormorant Garamond', serif);
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            color: var(--color-ivory, #FCFAF6);
            margin-bottom: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .error-message {
            font-family: var(--font-serif, 'Cormorant Garamond', serif);
            font-size: 1.6rem;
            font-style: italic;
            color: var(--color-gold, #D4AF37);
            margin-bottom: 2rem;
            line-height: 1.4;
        }
        .redirect-text {
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 3rem;
            color: rgba(252, 250, 246, 0.7);
            letter-spacing: 0.05em;
        }
        .btn-luxury {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 1px solid var(--color-gold, #D4AF37);
            color: var(--color-ivory, #FCFAF6);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.4s ease;
            background: transparent;
        }
        .btn-luxury:hover {
            background-color: var(--color-gold, #D4AF37);
            color: var(--color-charcoal, #2A2725);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Page Moved</h1>
        <div class="error-message">Our ceremony of love continues on our main page</div>
        <p class="redirect-text">You are being redirected to our homepage in <span id="countdown">3</span> seconds...</p>
        <a id="redirect-link" href="/" class="btn-luxury">Go to Homepage</a>
    </div>

    <script>
        // Mapping old page paths to sections of the new single-page experience
        const path = window.location.pathname.toLowerCase().replace(/\/$/, "");
        let target = "/";

        if (path.includes("gallery")) {
            target = "/gallery";
        } else if (path.includes("testimonial") || path.includes("stories") || path.includes("reviews") || path.includes("love")) {
            target = "/love-stories";
        } else if (path.includes("contact") || path.includes("book") || path.includes("inquiry")) {
            target = "/contact";
        } else if (path.includes("about") || path.includes("meaning") || path.includes("sweetness")) {
            target = "/about";
        } else if (path.includes("process") || path.includes("step") || path.includes("service")) {
            target = "/process";
        } else if (path.includes("locations") || path.includes("location") || path.includes("map")) {
            target = "/locations";
        } else if (path.includes("experience")) {
            target = "/experience";
        }

        document.getElementById("redirect-link").href = target;

        let timeLeft = 3;
        const countdownEl = document.getElementById("countdown");
        const interval = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(interval);
                window.location.href = target;
            }
        }, 1000);
    </script>
</body>
</html>
